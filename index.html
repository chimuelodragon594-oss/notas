<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
    <link 
     rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-black text-light d-flex align-items-center justify-content-center mi-vh-100 p-3">
<!--Tarjeta principal card-->
    <div class="card bg-dark text-light border-secondary shadow-lg col-12 col-sm-10 col-md-6 col-lg-4">
        <!--Encabezado con el nombre del estudiante-->
        <div class="card-header border-secondary text-center py-3">
            <span class="badge bg-info text-dark text.uppercase fw-bold mb-1">
                BTH Sistemas Informaticos 5to Sec.
            </span>
            <h2 id="nombreEstudiante" class="h4 fw-bold text-white mb-0">Alan Brito Delgado</h2>
        </div>
        <!--Cuerpo de la ficha-->
        <div class="card-body p-4 ">
            <!--Indicador del promedio Anual-->
            <div class="alert bg-black border border-secondary text-center mb-4">
                <p id="notaPromedio" class="fs-4 fw-bold mb-0 text-light">Promedio Anual: 0.0 Pts</p>
            </div>
            <div class="mb-3"> 
                <label for="notaTrimestral" class="form-label fw-semibold text-secondary">Nota 1er Trimstre (0 - 100)</label>
                <input type="number" id="notaTrimestre1" placeholder="Ej. 68" min="10" max="100" class="form-control bg-black text-light border-secondary">
            </div>
            <div class="mb-3">
                <label for="notaTrimestral" class="fs-4 fw-bold mb-0 text-light">Nota 2do Trimstre (0 - 100)</label>
                <input type="number" id="notaTrimestre2" placeholder="Ej. 68" min="10" max="100" class="form-control bg-black text-light border-secondary">
            </div>
            <div class="mb-3">
                <label for="notaTrimestral" class="fs-4 fw-bold mb-0 text-light">Nota 3er Trimstre (0 - 100)</label>
                <input type="number" id="notaTrimestre3" placeholder="Ej. 68" min="10" max="100" class="form-control bg-black text-light border-secondary">
            </div>
            <button id="btnCalcular" type="button" class="btn btn-success w-100 fw-bold py-2 text-uppercase" >Calcular Nota Final</button>
        </div>
        <div class="card-footer border-secondary text-center text-secondary samll">
            Nota minima de aprobacion: 51.0pts
        </div>
    </div>
    <script src="scrip.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
